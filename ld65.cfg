MEMORY {
  HEADER: start=$00, size=$10, fill=yes, fillval=$00;
  ZEROPAGE: start=$00, size=$0100;
  STACK: start=$0100, size=$0100;
  OAMBUFFER: start=$0200, size=$0100;
  RAM: start=$0300, size=$0500;
  PRG_ROM0: start=$8000, size=$2000, fill=yes, fillval=$FF;
  PRG_ROM1: start=$A000, size=$2000, fill=yes, fillval=$FF;
  PRG_ROM2: start=$8000, size=$2000, fill=yes, fillval=$FF;
  PRG_ROM3: start=$A000, size=$2000, fill=yes, fillval=$FF;
  PRG_ROM4: start=$8000, size=$2000, fill=yes, fillval=$FF;
  PRG_ROM5: start=$A000, size=$2000, fill=yes, fillval=$FF;
  PRG_ROM6: start=$C000, size=$2000, fill=yes, fillval=$FF;
  PRG_ROM7: start=$E000, size=$2000, fill=yes, fillval=$FF;
  CHR_ROM: start=$0000, size=$8000;
}

SEGMENTS {
  HEADER: load=HEADER, type=ro, align=$10;
  ZEROPAGE: load=ZEROPAGE, type=zp;
  STACK: load=STACK, type=bss, optional=yes;
  OAM: load=OAMBUFFER, type=bss, optional=yes;
  BSS: load=RAM, type=bss, optional=yes;
  CODE0: load=PRG_ROM0, type=ro, align=$0100;
  CODE1: load=PRG_ROM1, type=ro, align=$0100;
  CODE2: load=PRG_ROM2, type=ro, align=$0100;
  CODE3: load=PRG_ROM3, type=ro, align=$0100;
  CODE4: load=PRG_ROM4, type=ro, align=$0100;
  CODE5: load=PRG_ROM5, type=ro, align=$0100;
  FIXED_CODE0: load=PRG_ROM6, type=ro, align=$0100;
  DMC: load=PRG_ROM7, type=ro, align=64, optional=yes;
  FIXED_CODE1: load=PRG_ROM7, type=ro, align=$0100;
  RODATA: load=PRG_ROM7, type=ro, align=$0100;
  VECTORS: load=PRG_ROM7, type=ro, start=$FFFA;
  CHR_ROM: load=CHR_ROM, type=ro, align=16, optional=yes;
}